<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بصريات النقاء | سجل الزبائن والقياسات</title>
  <style>
    :root {
      --primary: #0f4c81;
      --primary-dark: #09355b;
      --accent: #0d9488;
      --accent-soft: #e6f7f5;
      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe3ee;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --shadow: 0 6px 20px rgba(15, 76, 129, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 48px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 18px 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: 0.18s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-light {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.85rem;
    }

    .container {
      max-width: 1040px;
      margin: 22px auto;
      padding: 0 16px;
    }

    .home-choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }

    @media (max-width: 680px) {
      .home-choices {
        grid-template-columns: 1fr;
      }
    }

    .choice-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: 0.2s ease;
    }

    .choice-card.active {
      border-color: var(--primary);
      background: #f0f7ff;
    }

    .choice-card h2 {
      margin: 8px 0 4px;
      font-size: 1.18rem;
      color: var(--primary);
    }

    .choice-card p {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .choice-icon {
      font-size: 1.8rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 16px;
      font-size: 1.12rem;
      color: var(--primary);
      padding-bottom: 10px;
      border-bottom: 1.5px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    @media (max-width: 720px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    .field input, .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
    }

    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    .rx-wrap {
      margin-top: 16px;
      overflow-x: auto;
      border: 1.5px solid var(--border);
      border-radius: 11px;
    }

    table.rx-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 540px;
      direction: ltr;
      text-align: center;
    }

    table.rx-table th {
      background: #eef4fb;
      color: var(--primary);
      padding: 9px 6px;
      font-size: 0.86rem;
      border-bottom: 1.5px solid var(--border);
    }

    table.rx-table td {
      padding: 7px 6px;
      border-top: 1px solid #edf2f7;
    }

    table.rx-table td.eye-cell {
      font-weight: 800;
      background: #f8fafc;
      color: var(--primary);
      width: 54px;
    }

    table.rx-table input {
      width: 100%;
      padding: 7px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      text-align: center;
      font-size: 0.92rem;
      direction: ltr;
    }

    .search-input-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-input-wrap input {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      font-size: 0.98rem;
    }

    .customer-item {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      background: #fff;
      overflow: hidden;
    }

    .customer-name-btn {
      width: 100%;
      background: #f8fafc;
      border: none;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: right;
      gap: 10px;
    }

    .customer-name-btn:hover {
      background: #eef4fa;
    }

    .c-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
    }

    .c-sub {
      font-size: 0.88rem;
      color: var(--muted);
      direction: ltr;
      text-align: right;
      margin-top: 2px;
    }

    .c-tag {
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .customer-panel {
      display: none;
      padding: 16px;
      border-top: 1.5px solid var(--border);
      background: #fff;
    }

    .customer-panel.open {
      display: block;
    }

    .profile-header-info {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.94rem;
    }

    .glasses-box {
      border: 1px solid #dbe3ee;
      background: #fafbfd;
      border-radius: 11px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .glasses-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
